name: Debug container network

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: uname -r; docker info --format '{{.SecurityOptions}}'
      - name: i386, what fails
        continue-on-error: true
        run: docker run --rm i386/debian:trixie-slim bash -c "getent hosts deb.debian.org; echo getent=\$?; getent ahostsv4 deb.debian.org | head -2; echo v4=\$?; (exec 3<>/dev/tcp/151.101.2.132/80 && echo tcp-by-ip-ok) 2>&1"
      - name: i386, seccomp unconfined
        continue-on-error: true
        run: docker run --rm --security-opt seccomp=unconfined i386/debian:trixie-slim bash -c "getent hosts deb.debian.org; apt-get update -qq 2>&1 | tail -3; echo exit=\$?"
      - name: i386 bookworm
        continue-on-error: true
        run: docker run --rm i386/debian:bookworm-slim bash -c "getent hosts deb.debian.org; apt-get update -qq 2>&1 | tail -3; echo exit=\$?"
