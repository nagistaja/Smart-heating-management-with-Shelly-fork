name: Debug container network

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: docker version --format '{{.Server.Version}}'; cat /etc/resolv.conf | head -5
      - name: default network
        continue-on-error: true
        run: docker run --rm i386/debian:trixie-slim bash -c "cat /etc/resolv.conf; getent hosts deb.debian.org; apt-get update -qq 2>&1 | tail -3; echo exit=\$?"
      - name: amd64 image, default network
        continue-on-error: true
        run: docker run --rm debian:trixie-slim bash -c "getent hosts deb.debian.org; apt-get update -qq 2>&1 | tail -3"
      - name: host network
        continue-on-error: true
        run: docker run --rm --network host i386/debian:trixie-slim bash -c "getent hosts deb.debian.org; apt-get update -qq 2>&1 | tail -3"
      - name: started detached, then exec after a pause
        continue-on-error: true
        run: |
          docker run -d --name probe i386/debian:trixie-slim sleep infinity
          docker exec probe bash -c "getent hosts deb.debian.org; apt-get update -qq 2>&1 | tail -3"
          docker rm -f probe
